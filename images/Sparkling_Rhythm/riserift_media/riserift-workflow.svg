  <!-- Pillar 3: Motion & Animation -->
  <g transform="translate(785, 210)">
    <rect width="315" height="490" rx="20" fill="url(#panel-grad)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.2"/>
    <rect x="25" y="25" width="44" height="44" rx="10" fill="#FFB703" fill-opacity="0.2"/>
    <path d="M42 39 L54 47 L42 55 Z" fill="#FFB703"/>

    <text x="80" y="47" font-family="'Space Grotesk', sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Motion &amp; Video</text>
    <text x="80" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#FFB703">Dynamic Content</text>

    <line x1="25" y1="88" x2="290" y2="88" stroke="#FFFFFF" stroke-opacity="0.1"/>

    <!-- Tool Items -->
    <g transform="translate(25, 110)">
      <rect width="265" height="75" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Adobe After Effects</text>
      <text x="20" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">Kinetic typography, animated promo reels,</text>
      <text x="20" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">and commercial motion branding</text>
    </g>

    <g transform="translate(25, 200)">
      <rect width="265" height="75" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Procreate Dreams</text>
      <text x="20" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">Keyframe animation, 2D organic motion,</text>
      <text x="20" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&amp; hand-drawn motion accents</text>
    </g>

    <!-- Role Highlight Box -->
    <g transform="translate(25, 290)">
      <rect width="265" height="180" rx="12" fill="#0A0F1D" fill-opacity="0.5" stroke="#FFB703" stroke-opacity="0.2"/>
      <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#FFB703">MOTION ENGAGEMENT</text>
      <text x="20" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#CBD5E1">
        Crafting short, thumb-stopping
      </text>
      <text x="20" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#CBD5E1">
        motion reels tailored for vertical
      </text>
      <text x="20" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#CBD5E1">
        video consumption across social media
      </text>
      <text x="20" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#CBD5E1">
        campaign channels.
      </text>
    </g>
  </g>

  <!-- Confidentiality Footer -->
  <text x="600" y="745" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#64748B">
    Confidentiality Notice: Creative asset examples and design methodology can be viewed during interview discussions.
  </text>
</svg>
