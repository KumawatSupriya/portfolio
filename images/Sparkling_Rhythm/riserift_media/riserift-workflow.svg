    <g transform="translate(25, 200)">
      <rect width="265" height="75" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Procreate</text>
      <text x="20" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">Custom digital illustration, sketch ideation,</text>
      <text x="20" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">&amp; hand-crafted artistic assets</text>
    </g>

    <!-- Role Highlight Box -->
    <g transform="translate(25, 290)">
      <rect width="265" height="180" rx="12" fill="#0A0F1D" fill-opacity="0.5" stroke="#00F0FF" stroke-opacity="0.2"/>
      <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#00F0FF">IMAGE FIDELITY</text>
      <text x="20" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#CBD5E1" line-height="1.5">
        Balancing visual polish with strict
      </text>
      <text x="20" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#CBD5E1">
        compression standards for social feeds
      </text>
      <text x="20" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#CBD5E1">
        and responsive digital banners to
      </text>
      <text x="20" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#CBD5E1">
        maintain high contrast and clarity.
      </text>
    </g>
