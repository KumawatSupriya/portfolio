<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#141832"/>
      <stop offset="100%" stop-color="#1f1538"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5D8F"/>
      <stop offset="50%" stop-color="#7B2CBF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5D8F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="glow-pink" cx="20%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#FF5D8F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF5D8F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#bg-grad)"/>

  <!-- Atmospheric Glow Orbs -->
  <circle cx="250" cy="220" r="320" fill="url(#glow-pink)"/>
  <circle cx="950" cy="580" r="380" fill="url(#glow-cyan)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="150" y1="0" x2="150" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="450" y1="0" x2="450" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="750" y1="0" x2="750" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
    <line x1="1050" y1="0" x2="1050" y2="800"/>
  </g>

  <!-- Central Glassmorphic Card Container -->
  <rect x="120" y="90" width="960" height="620" rx="28" fill="url(#glass-grad)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Top Confidential Pill Badge -->
  <g transform="translate(180, 150)">
    <rect x="0" y="0" width="310" height="42" rx="21" fill="#FF5D8F" fill-opacity="0.18" stroke="#FF5D8F" stroke-opacity="0.5" stroke-width="1.2"/>
    <!-- Lock Icon -->
    <path d="M28 24 V19 A6 6 0 0 1 40 19 V24 M24 24 H44 V34 H24 Z" fill="none" stroke="#FF70A6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34" cy="28.5" r="1.5" fill="#FF70A6"/>
    <text x="56" y="26" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#FF8FA3" letter-spacing="1.2">CONFIDENTIAL CLIENT WORK</text>
  </g>

  <!-- Company Title & Role -->
  <text x="180" y="270" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    RiseRift Media
  </text>
  <text x="180" y="325" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="24" font-weight="600" fill="#48CAE4">
    Digital Content &amp; Campaign Assets
  </text>

  <!-- Brief Role Description -->
  <text x="180" y="375" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94A3B8" line-height="1.6">
    Independent creative production covering high-engagement social media campaigns, promotional motion reels,
  </text>
  <text x="180" y="405" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94A3B8">
    marketing banners, brand collateral, and digital illustrations.
  </text>

  <!-- Scope Pill Tags Grid -->
  <g transform="translate(180, 450)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="195" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="20" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#E2E8F0">Social Media Creatives</text>

    <!-- Tag 2 -->
    <rect x="210" y="0" width="190" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="230" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#E2E8F0">Motion Graphics &amp; Reels</text>

    <!-- Tag 3 -->
    <rect x="415" y="0" width="190" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="435" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#E2E8F0">Advertising Banners</text>

    <!-- Tag 4 -->
    <rect x="620" y="0" width="170" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="640" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#E2E8F0">Digital Artwork</text>
  </g>

  <!-- Bottom NDA Protocol Bar -->
  <g transform="translate(180, 560)">
    <rect x="0" y="0" width="840" height="90" rx="16" fill="#0A0F1D" fill-opacity="0.65" stroke="#48CAE4" stroke-opacity="0.25" stroke-width="1"/>
    
    <!-- Shield / Check Icon -->
    <g transform="translate(30, 25)">
      <circle cx="20" cy="20" r="20" fill="#00F0FF" fill-opacity="0.12"/>
      <path d="M20 10 L30 14 V21 C30 27 25 31 20 33 C15 31 10 27 10 21 V14 Z" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="85" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
      Non-Disclosure Agreement (NDA) Protected Case Study
    </text>
    <text x="85" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
      Direct creative assets are proprietary. Detailed workflows, case methodologies, and samples are available during interviews.
    </text>
  </g>

  <!-- Decorative Corner Accents -->
  <circle cx="1030" cy="140" r="4" fill="#00F0FF"/>
  <circle cx="1045" cy="140" r="4" fill="#FF5D8F"/>
  <circle cx="1060" cy="140" r="4" fill="#7B2CBF"/>
</svg>
